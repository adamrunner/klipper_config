#####################################################################
#  Probe history: periodic full-bed reference mesh
#
#  Install: copy to ~/printer_data/config/, add  [include probe_history.cfg]
#  to printer.cfg, and in macros.cfg [gcode_macro G32] replace
#      BED_MESH_CALIBRATE
#  with
#      _PROBEHIST_MESH
#
#  During a print (START_PRINT -> G32) every `every_n_prints`-th print also
#  probes a full-bed reference mesh before the normal KAMP mesh.  The print
#  always uses the KAMP mesh (set replace_kamp: True to print on the reference
#  mesh instead and skip KAMP).  Outside a print (manual G32) it is plain
#  BED_MESH_CALIBRATE.
#  A reference mesh only runs when the chamber is at printing temperature;
#  otherwise it is deferred to the next print.
#
#  The collector picks up the "probehist: reference" console line and tags the
#  mesh, so full-bed meshes can be compared directly across time.
#####################################################################

[save_variables]
filename: ~/printer_data/config/probe_history_vars.cfg

[gcode_macro _PROBEHIST]
variable_every_n_prints: 10
variable_min_chamber: 58.0
variable_mesh_min: "30,30"
variable_mesh_max: "320,315"   # Y320 hits the nozzle brush at X~127 (Tap bottom bolts)
variable_probe_count: "7,7"
variable_replace_kamp: False
gcode:
    {action_respond_info("_PROBEHIST only stores settings")}

[gcode_macro _PROBEHIST_REF_MESH]
description: Full-bed reference mesh (tagged for probe history)
gcode:
    {% set cfg = printer["gcode_macro _PROBEHIST"] %}
    {action_respond_info("probehist: reference")}
    _BED_MESH_CALIBRATE MESH_MIN={cfg.mesh_min} MESH_MAX={cfg.mesh_max} PROBE_COUNT={cfg.probe_count} ALGORITHM=bicubic
    SAVE_VARIABLE VARIABLE=probehist_prints_since_ref VALUE=0

[gcode_macro _PROBEHIST_MESH]
description: Bed mesh for G32: KAMP-adapted, plus a full-bed reference mesh first when one is due
gcode:
    {% set cfg = printer["gcode_macro _PROBEHIST"] %}
    {% set since = printer.save_variables.variables.probehist_prints_since_ref | default(999) | int %}
    {% set chamber = printer["temperature_sensor chamber"].temperature %}
    {% set printing = printer.print_stats.state == "printing" %}
    {% if printing and since + 1 >= cfg.every_n_prints and chamber >= cfg.min_chamber %}
        {action_respond_info("probehist: reference mesh due (%d prints since last)" % since)}
        _PROBEHIST_REF_MESH
        {% if not cfg.replace_kamp %}
            BED_MESH_CLEAR
            BED_MESH_CALIBRATE
        {% endif %}
    {% else %}
        {% if printing and since + 1 >= cfg.every_n_prints %}
            {action_respond_info("probehist: reference mesh due but chamber %.1fC < %.1fC; deferred" % (chamber, cfg.min_chamber))}
        {% endif %}
        BED_MESH_CALIBRATE
        {% if printing %}
            SAVE_VARIABLE VARIABLE=probehist_prints_since_ref VALUE={since + 1}
        {% endif %}
    {% endif %}

[gcode_macro PROBE_REFERENCE]
description: Full-bed reference mesh now. Refuses below the chamber threshold unless FORCE=1
gcode:
    {% set cfg = printer["gcode_macro _PROBEHIST"] %}
    {% set chamber = printer["temperature_sensor chamber"].temperature %}
    {% if chamber < cfg.min_chamber and params.FORCE|default(0)|int == 0 %}
        {action_raise_error("PROBE_REFERENCE: chamber %.1fC is below %.1fC (FORCE=1 to override)" % (chamber, cfg.min_chamber))}
    {% endif %}
    _CG28
    _CQGL
    BED_MESH_CLEAR
    _PROBEHIST_REF_MESH
